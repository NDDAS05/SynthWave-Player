name: Build SynthWave Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDK_MANAGER" --licenses >/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore ] && keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            echo "Using existing valid debug.keystore"
            exit 0
          fi

          if [ -f debug.keystore.base64 ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore 2>/dev/null || true
            if keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
              echo "Decoded valid debug.keystore from debug.keystore.base64"
              exit 0
            fi
            if gzip -t debug.keystore >/dev/null 2>&1; then
              gzip -dc debug.keystore > debug.keystore.tmp && mv debug.keystore.tmp debug.keystore
              if keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
                echo "Decoded gzipped debug.keystore from debug.keystore.base64"
                exit 0
              fi
            fi
            echo "Warning: debug.keystore.base64 did not produce a valid keystore; generating a fresh debug.keystore for CI."
            rm -f debug.keystore debug.keystore.tmp
          fi

          keytool -genkeypair -noprompt \
            -keystore debug.keystore \
            -storetype PKCS12 \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: synthwave-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
